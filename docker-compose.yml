version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  basket-service:
    build:
      context: .
      dockerfile: Services/BasketService/Dockerfile
    ports:
      - "5026:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: Services/OrderService/Dockerfile
    ports:
      - "5132:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      basket-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: Services/PaymentService/Dockerfile
    ports:
      - "5017:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started

  product-service:
    build:
      context: .
      dockerfile: Services/ProductService/Dockerfile
    ports:
      - "5014:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  aggregator:
    build:
      context: .
      dockerfile: ApiGateways/Aggregator/Dockerfile
    ports:
      - "5016:5016"
    environment:
      - ASPNETCORE_URLS=http://+:5016
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      product-service:
        condition: service_started

  ocelot-api-gateway:
    build:
      context: .
      dockerfile: ApiGateways/OcelotApiGateway/Dockerfile
    ports:
      - "5231:5231"
    environment:
      - ASPNETCORE_URLS=http://+:5231
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      basket-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      product-service:
        condition: service_started
      aggregator:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: 